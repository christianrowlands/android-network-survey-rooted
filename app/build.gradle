apply plugin: 'com.android.application'
apply from: "../artifacts.gradle"

// Exclude google-services and crashlytics if the json file is missing and for debug builds
if (file("google-services.json").exists() && !gradle.startParameter.taskNames.any { it.contains("Debug") || it.contains("test") }) {
    logger.quiet("Using the google-services.json file")
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
}

ext.networkSurveyMessagingVersion = '1.5.0'

android {
    compileSdk 36
    ndkVersion '29.0.14206865'

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        buildConfigField "String", "MESSAGING_API_VERSION", "\"${networkSurveyMessagingVersion}\""
        applicationId "com.craxiom.networksurveyplus"
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName "0.6.1"
        setProperty("archivesBaseName", "$applicationName-$versionName")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions = ['distribution']
    productFlavors {
        // GitHub releases, which IzzyOnDroid pulls from
        github {
            dimension 'distribution'
            buildConfigField "boolean", "START_AT_BOOT_SUPPORTED", "true"
        }
        // Google Play does not allow background location without a policy declaration, so start at boot is removed.
        // This is also the only build that contains Firebase Crashlytics and Analytics.
        play {
            dimension 'distribution'
            buildConfigField "boolean", "START_AT_BOOT_SUPPORTED", "false"
        }
    }

    dependenciesInfo {
        // Disables the encrypted dependency metadata block (requested by IzzyOnDroid)
        includeInApk = false
        includeInBundle = false
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    externalNativeBuild {
        ndkBuild {
            path file('jni/Android.mk')
        }
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties', 'google/cloud/audit/audit_log.proto', 'log4j.properties']
        }
        jniLibs { useLegacyPackaging = true }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
    namespace 'com.craxiom.networksurveyplus'

}

configurations.configureEach {
    exclude group: 'com.google.android.gms', module: 'play-services-ads'
    exclude group: 'com.google.android.gms', module: 'play-services-ads-identifier'
    exclude group: 'com.google.android.gms', module: 'play-services-ads-lite'
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.guava:guava:32.1.3-android'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'

    implementation("com.craxiom:network-survey-messaging:${networkSurveyMessagingVersion}") {
        exclude group: 'com.google.api.grpc', module: 'proto-google-common-protos'
    }
    implementation 'com.google.protobuf:protobuf-java-util:4.27.3'
    implementation 'com.craxiom:mqtt-library:0.4.3'

    // Only include Firebase in the Google Play build
    playImplementation platform('com.google.firebase:firebase-bom:34.19.0')
    playImplementation 'com.google.firebase:firebase-analytics'
    playImplementation 'com.google.firebase:firebase-crashlytics'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}