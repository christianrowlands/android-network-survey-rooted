// Top-level build file where you can add configuration options common to all sub-projects/modules.

// Only pull the Firebase related Gradle plugins onto the buildscript classpath when google-services.json is
// present. The GitHub / IzzyOnDroid builds can then be built from the public source without that file, and no
// Firebase artifacts are resolved on those builds. The `apply plugin:` calls in app/build.gradle are also conditional.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        if (file("app/google-services.json").exists()) {
            classpath 'com.google.gms:google-services:4.5.0'
            classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.8'
        }

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}