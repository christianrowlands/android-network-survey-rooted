name: Network Survey+ CI

on:
  pull_request:
    branches:
      - 'develop'
  push:
    branches:
      - 'develop'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    if: "! startsWith(github.event.head_commit.message, 'Bump version to')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'

      # The Firebase Gradle plugins are never applied to debug builds, so google-services.json is not needed here
      - name: Build Debug APKs
        run: ./gradlew assembleGithubDebug assemblePlayDebug

      - name: Upload GitHub APK
        uses: actions/upload-artifact@v6
        with:
          name: Network Survey+ GitHub Debug APK
          path: app/build/outputs/apk/github/debug/*.apk

      - name: Upload Play APK
        uses: actions/upload-artifact@v6
        with:
          name: Network Survey+ Play Debug APK
          path: app/build/outputs/apk/play/debug/*.apk

  test:
    if: "! startsWith(github.event.head_commit.message, 'Bump version to')"
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Unit Tests
        run: ./gradlew test --stacktrace

      # Only upload the reports on failure
      - name: Upload Reports
        uses: actions/upload-artifact@v6
        with:
          name: Test-Reports
          path: app/build/reports
        if: failure()
