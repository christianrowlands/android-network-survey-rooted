android.applicationVariants.all { variant ->
    def appName
    // Check if an applicationName property is supplied; if not use the name of the parent project.
    if (project.hasProperty("applicationName")) {
        appName = applicationName
    } else {
        appName = parent.name
    }

    variant.outputs.all { output ->
        // Keep the GitHub APK name the same as previous releases (e.g. networksurveyplus-release-0.6.0.apk) so the
        // IzzyOnDroid updater continues to match it
        def label = variant.flavorName == 'github' ? variant.buildType.name : output.baseName
        outputFileName = "${appName}-${label}-${variant.versionName}.apk"
    }
}